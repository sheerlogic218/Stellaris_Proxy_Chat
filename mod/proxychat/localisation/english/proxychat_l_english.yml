l_english:
 proxychat.20.name:0 "Subspace Channel"
 proxychat.20.desc:0 "Our communications array is aligned with §H[proxychat_target.GetName]§!.\n\nWe can join their Voice Channel or request a private call. Members of their federation, and empires with association status, can also join the federation's Voice Channel."
 proxychat.20.join:0 "Join their Voice Channel"
 proxychat.20.federation:0 "Join the [proxychat_target.Federation.GetName] Voice Channel"
 proxychat.20.hail:0 "Request a private call"
 proxychat.20.cancel:0 "Close the channel"
 proxychat.21.name:0 "Incoming Call"
 proxychat.21.desc:0 "§H[proxychat_caller.GetName]§! is calling us on a private Voice Channel."
 proxychat.21.accept:0 "Accept the call"
 proxychat.21.decline:0 "Ignore the call"
 proxychat.22.name:0 "Call Accepted"
 proxychat.22.desc:0 "§H[proxychat_target.GetName]§! accepted our call. Connecting..."
 proxychat.23.name:0 "Call Ignored"
 proxychat.23.desc:0 "§H[proxychat_target.GetName]§! did not answer our call."
 proxychat.ok:0 "OK"
 PROXYCHAT_VOICE_BUTTON:0 "Voice Chat"
 PROXYCHAT_VOICE_BUTTON_DESC:0 "Open the voice chat menu: return to your own Voice Channel, join the Galactic Community Voice Channel or a federation Voice Channel (your own, or one you have association status with), and see which player empires you have communications with."
 proxychat.40.name:0 "Voice Chat"
 proxychat.40.home:0 "Return to my Voice Channel"
 proxychat.40.galcom:0 "Join the Galactic Community Voice Channel"
 proxychat.40.federation:0 "Join the [Root.Federation.GetName] Voice Channel"
 proxychat.40.close:0 "Close"
